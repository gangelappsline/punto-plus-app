name: Flutter CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate models
        id: codegen
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Static analysis
        id: analyze
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee analyze.log
      - name: Unit and widget tests
        id: tests
        if: ${{ !cancelled() && steps.codegen.outcome == 'success' }}
        run: |
          set -o pipefail
          flutter test --coverage --reporter expanded 2>&1 | tee tests.log
      - name: Report failures on the pull request
        if: ${{ failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/report_ci.py analyze.log tests.log
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  android:
    runs-on: ubuntu-24.04
    needs: analyze-and-test
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build Android demo
        run: |
          set -o pipefail
          flutter build apk --debug --dart-define=DEMO_MODE=true 2>&1 | tee android.log
      - name: Report failures on the pull request
        if: ${{ failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/report_ci.py android.log
      - uses: actions/upload-artifact@v4
        with:
          name: punto-plus-demo-android
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios:
    runs-on: macos-14
    needs: analyze-and-test
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build iOS simulator demo
        run: |
          set -o pipefail
          flutter build ios --simulator --debug --no-codesign --dart-define=DEMO_MODE=true 2>&1 | tee ios.log
      - name: Report failures on the pull request
        if: ${{ failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/report_ci.py ios.log
