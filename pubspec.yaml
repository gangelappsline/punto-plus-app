name: punto_plus_app
description: Punto Plus — tarjetas de fidelidad para clientes y negocios.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  riverpod_annotation: 2.6.1
  go_router: 14.8.1
  dio: 5.7.0
  freezed_annotation: 2.4.4
  json_annotation: 4.9.0
  flutter_secure_storage: 9.2.4
  shared_preferences: 2.3.5
  google_maps_flutter: 2.10.0
  geolocator: 13.0.2
  mobile_scanner: 6.0.6
  qr_flutter: 4.1.0
  cached_network_image: 3.4.1
  flutter_svg: 2.0.17
  lottie: 3.3.1
  image_picker: 1.1.2
  file_picker: 8.1.7
  path_provider: 2.1.5
  flutter_local_notifications: 18.0.1
  intl: 0.19.0
  url_launcher: 6.3.1
  share_plus: 10.1.4
  package_info_plus: 8.1.3
  device_info_plus: 11.2.1
  connectivity_plus: 6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  very_good_analysis: 7.0.0
  build_runner: 2.4.14
  freezed: 2.5.7
  json_serializable: 6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/animations/
